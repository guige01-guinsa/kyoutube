name: Marketing Quality
on:
  pull_request:
    paths:
      - 'lib/features/marketing/**'
      - 'test/features/marketing/**'
      - 'tools/marketing/**'
      - 'supabase/functions/marketing_generate/**'
      - 'supabase/functions/story_studio_dispatch/**'
      - 'supabase/migrations/*_marketing_automation.sql'
      - 'supabase/migrations/*_story_studio.sql'
      - 'supabase/migrations/*_source_recipe_studio.sql'
      - '.github/workflows/story-studio-*.yml'
      - '.github/workflows/marketing-*.yml'
  push:
    paths:
      - 'tools/marketing/**'
      - 'supabase/functions/marketing_generate/**'
      - 'supabase/functions/story_studio_dispatch/**'
      - 'supabase/migrations/*_marketing_automation.sql'
      - 'supabase/migrations/*_story_studio.sql'
      - 'supabase/migrations/*_source_recipe_studio.sql'
      - '.github/workflows/story-studio-*.yml'
      - '.github/workflows/marketing-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - name: Type check Edge Function
        run: |
          deno check supabase/functions/marketing_generate/index.ts supabase/functions/story_studio_dispatch/index.ts
          deno test supabase/functions/story_studio_dispatch/handler_test.ts
      - name: Worker tests
        run: node --test tools/marketing/worker.test.mjs tools/marketing/story_studio.test.mjs tools/marketing/story_studio_narration.test.mjs tools/marketing/story_studio_speech_cache.test.mjs tools/marketing/story_studio_standard.test.mjs tools/marketing/story_studio_standard_worker.test.mjs tools/marketing/story_studio_recipe.test.mjs tools/marketing/story_studio_recipe_worker.test.mjs tools/marketing/story_studio_recipe_source.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/marketing/requirements.txt
      - name: Install renderer and database test tools
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: -r tools/marketing/requirements.txt
          mkdir -p "$RUNNER_TEMP/marketing-bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/marketing-bin/ffmpeg"
          echo "$RUNNER_TEMP/marketing-bin" >> "$GITHUB_PATH"
          npm install --prefix /tmp/marketing-db @electric-sql/pglite@0.3.14
      - name: Database security and queue behavior
        env:
          MARKETING_PGLITE_PATH: /tmp/marketing-db/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node tools/marketing/database.test.mjs
          node tools/marketing/story_studio_database.test.mjs
          node tools/marketing/story_studio_standard_database.test.mjs
      - name: Trilingual studio layout and 60-second preview
        timeout-minutes: 3
        run: python tools/marketing/story_studio_render_test.py
      - name: Existing-media narrated re-edit safety and scrolling
        timeout-minutes: 3
        run: python tools/marketing/story_studio_reedit_test.py
      - name: Korean one-minute standard (synthetic audio, no paid requests)
        timeout-minutes: 3
        run: python tools/marketing/story_studio_standard_render_test.py
      - name: Offline story pilot safety and layout tests
        timeout-minutes: 3
        run: python tools/marketing/story_series_synthetic_test.py
      - name: Render smoke test
        timeout-minutes: 3
        env:
          MARKETING_FONT: ${{ github.workspace }}/assets/fonts/NanumGothic-Regular.ttf
        run: python tools/marketing/render_test.py

      - name: Source recipe three-minute offline render
        timeout-minutes: 3
        run: python tools/marketing/story_studio_recipe_render_test.py
