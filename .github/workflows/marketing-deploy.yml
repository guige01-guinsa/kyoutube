name: Deploy Marketing Function
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check function and worker
        run: |
          deno check supabase/functions/marketing_generate/index.ts
          node --test tools/marketing/worker.test.mjs
      - uses: supabase/setup-cli@v1
      - name: Deploy marketing function only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing Supabase access token."; exit 1; }
          supabase functions deploy marketing_generate --project-ref dfczeudklykypysiseck
