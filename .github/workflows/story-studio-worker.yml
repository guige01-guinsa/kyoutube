name: YouTube read-only diagnostic
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      preflight:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  readonly:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose connection and existing videos without uploading
        env:
          SUPABASE_URL: ${{ secrets.MARKETING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MARKETING_SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.MARKETING_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.MARKETING_YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.MARKETING_YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ vars.MARKETING_YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CHANNEL_HANDLE: ${{ vars.MARKETING_YOUTUBE_CHANNEL_HANDLE }}
        run: node tools/marketing/youtube_readonly_diagnostic.mjs
