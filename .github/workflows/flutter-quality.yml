name: Flutter Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original v99 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v99-assets"
          gh release download 'v1.0.1+99' --repo guige01-guinsa/kyoutube --pattern 'recipe-scout-v99-assets.zip' --dir "$RUNNER_TEMP/v99-assets"
          python3 tools/dev/restore_v99_assets.py "$RUNNER_TEMP/v99-assets/recipe-scout-v99-assets.zip"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
