project_id = "k-youtube"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "io.supabase.kyoutube://login-callback"
enable_anonymous_sign_ins = true
additional_redirect_urls = [
  "io.supabase.kyoutube://login-callback",
  "http://127.0.0.1:54321/auth/v1/callback"
]

[auth.external.google]
enabled = true
# Google Cloud Console → API 및 서비스 → OAuth 2.0 클라이언트 → 클라이언트 ID (웹 애플리케이션)
client_id = "env(AUTH_GOOGLE_CLIENT_ID)"
secret = "env(AUTH_GOOGLE_SECRET)"
# 승인된 리디렉션 URI에 아래 URL 추가 필요:
# https://<project-ref>.supabase.co/auth/v1/callback  (프로덕션)
# http://127.0.0.1:54321/auth/v1/callback             (로컬)

[auth.external.kakao]
enabled = false
# Kakao Developers → 내 애플리케이션 → REST API 키를 client_id로 사용
client_id = ""
secret = "env(AUTH_KAKAO_SECRET)"
# Kakao 앱 설정 → 카카오 로그인 → Redirect URI에 아래 URL 추가 필요:
# https://<project-ref>.supabase.co/auth/v1/callback  (프로덕션)
# http://127.0.0.1:54321/auth/v1/callback             (로컬)

[functions.delete-account]
enabled = true
verify_jwt = false
import_map = "./functions/delete-account/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-account/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-account/*.html" ]
