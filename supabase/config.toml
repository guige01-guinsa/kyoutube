[functions.membership_notifications]
enabled = true
# Google OIDC is validated in the handler; this is not a Supabase JWT.
verify_jwt = false
entrypoint = "./functions/membership_notifications/index.ts"

[functions.youtube_search]
enabled = true
verify_jwt = true
entrypoint = "./functions/youtube_search/index.ts"

# Scheduler-only endpoint. A separate >=32-character secret is verified in handler.
[functions.operations_monitor]
enabled = true
verify_jwt = false
entrypoint = "./functions/operations_monitor/index.ts"

[functions.prelaunch_growth]
enabled = true
# Public opt-in endpoint: bounded input, allowed origin, server-validated CAPTCHA.
verify_jwt = false
entrypoint = "./functions/prelaunch_growth/index.ts"

[functions.prelaunch_delivery]
